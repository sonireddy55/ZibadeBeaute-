# The site is hosted on Cloudflare Pages (zibadebeaute.pages.dev), which builds it
# from this repo on every push. This workflow only keeps the old GitHub Pages
# address working: it publishes redirect/, which forwards every old URL to the
# same page on Cloudflare.
name: GitHub Pages redirect

on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
